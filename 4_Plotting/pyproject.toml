[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "catplot"
version = "0.9.0"
description = "A small, reproducible plotting backend for publication panels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2,<3",
    "PyYAML>=6,<7",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pypdf>=5", "pytest>=8"]
io = ["openpyxl>=3.1", "pyarrow>=15"]

[project.scripts]
catplot = "catplot.cli.main:main"
plt = "catplot.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catplot = [
    "style/sheets/*.mplstyle",
    "style/themes/*.yaml",
    "style/defaults/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
