schema: 1
style: {profile: paper, theme: default}
layout: {type: single, edge_mm: 85}
data:
  directions:
    path: ../../freqball-analysis/freqball_directions.csv
    filters: [{column: direction_kind, op: eq, value: sampled}]
panels:
  - id: descriptors
    axes:
      x: {label: Conduction alignment}
      y: {label: Average frequency (THz)}
    legend: false
    colorbar: {label: Conduction minus tetrahedral alignment}
    layers:
      - type: scatter
        data: directions
        mapping: {x: conduction_alignment, y: average_frequency_THz, color: direction_score}
        options: {cmap: coolwarm, vmin: -1, vmax: 1, size: 6, alpha: 0.55, linewidth: 0}
output: {name: freqball-direction-map, directory: ../../plots, formats: [pdf]}
