schema: 1
style: {profile: paper, theme: default}
layout: {type: single, edge_mm: 85}
data:
  spectra:
    path: ../../freqball-mass-analysis/freqball_mass_family_spectra.csv
    filters:
      - {column: equivalence_group, op: eq, value: 0}
      - {column: mass_u, op: eq, value: 32.06}
panels:
  - id: mass-family-spectra
    axes:
      x: {label: Frequency (THz)}
      y: {label: "Directional DOS (THz$^{-1}$)"}
    legend: {frameon: false}
    layers:
      - type: line
        data: spectra
        mapping: {x: frequency_THz, y: pdos_per_THz, group: trace}
        options: {linewidth: 1.2}
output: {name: freqball-mass-family-spectra, directory: ../../plots, formats: [pdf]}
